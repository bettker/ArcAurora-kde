# ArcAurora-kde color palette
#
# Edit the two values below, then run:
#   python3 generate.py
#   ./install.sh
#
# Both values must be 6-digit hex (e.g. #58d147). All other tones used by
# the theme (button hover, pressed, panels, alt rows, shadows) are derived
# automatically by preserving the HSL relationship to these two base colors.
# To pin a derived tone to a specific hex, uncomment the [overrides]
# section below.

[base]
accent     = #58d147
background = #052424

